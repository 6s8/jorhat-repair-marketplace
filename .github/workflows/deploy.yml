name: Deploy All 3 Apps to GitHub Pages

on:
  push:
    branches:
      - main  # or master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Install Dependencies
        run: flutter pub get

      - name: 4. Build Customer App
        run: |
          flutter build web \
            --release \
            -t lib/main_customer.dart \
            -o build/web/customer \
            --base-href "/jorhat-repair-marketplace/customer/"

      - name: 5. Build Technician App
        run: |
          flutter build web \
            --release \
            -t lib/main_technician.dart \
            -o build/web/technician \
            --base-href "/jorhat-repair-marketplace/technician/"

      - name: 6. Build Retailer App
        run: |
          flutter build web \
            --release \
            -t lib/main_retailer.dart \
            -o build/web/retailer \
            --base-href "/jorhat-repair-marketplace/retailer/"

      - name: 7. Create Root Landing Page (App Hub)
        run: |
          cat << 'EOF' > build/web/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Assam Repair & Parts Marketplace</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
              h1 { font-size: 2rem; margin-bottom: 8px; text-align: center; color: #38bdf8; }
              p { color: #94a3b8; margin-bottom: 32px; text-align: center; }
              .card-container { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 400px; }
              .app-card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; text-decoration: none; color: white; transition: all 0.2s ease; display: flex; align-items: center; gap: 16px; }
              .app-card:hover { transform: translateY(-2px); border-color: #38bdf8; background: #334155; }
              .icon { font-size: 28px; }
              .title { font-weight: 600; font-size: 1.1rem; }
              .desc { font-size: 0.85rem; color: #94a3b8; }
            </style>
          </head>
          <body>
            <h1>Assam Repair Marketplace</h1>
            <p>Select an entry point to launch the application portal:</p>
            <div class="card-container">
              <a href="./customer/" class="app-card">
                <span class="icon">🛒</span>
                <div>
                  <div class="title">Customer App</div>
                  <div class="desc">Book appliance repairs & order parts</div>
                </div>
              </a>
              <a href="./technician/" class="app-card">
                <span class="icon">🛠️</span>
                <div>
                  <div class="title">Technician App</div>
                  <div class="desc">Accept jobs & buy wholesale parts</div>
                </div>
              </a>
              <a href="./retailer/" class="app-card">
                <span class="icon">🏪</span>
                <div>
                  <div class="title">Retailer App</div>
                  <div class="desc">Manage inventory & process orders</div>
                </div>
              </a>
            </div>
          </body>
          </html>
          EOF

      - name: 8. Add SPA & Jekyll Bypass Files
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - name: 9. Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          
