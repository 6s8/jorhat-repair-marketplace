name: Deploy Fixly Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/Services-repair-marketplace/"

      - name: Create .nojekyll
        run: touch build/web/.nojekyll

      - name: Create 404.html for SPA routing
        run: cp build/web/index.html build/web/404.html

      - name: Verify build output
        run: |
          echo "--- Build output contents ---"
          ls -la build/web/
          echo "--- Verifying index.html exists ---"
          test -f build/web/index.html && echo "✅ index.html found" || (echo "❌ index.html missing" && exit 1)
          test -f build/web/404.html && echo "✅ 404.html found" || (echo "❌ 404.html missing" && exit 1)
          test -f build/web/.nojekyll && echo "✅ .nojekyll found" || (echo "❌ .nojekyll missing" && exit 1)
          test -f build/web/flutter_bootstrap.js && echo "✅ flutter_bootstrap.js found" || (echo "❌ flutter_bootstrap.js missing" && exit 1)
          test -f build/web/main.dart.js && echo "✅ main.dart.js found" || (echo "❌ main.dart.js missing" && exit 1)
          echo "--- Checking base href in index.html ---"
          grep 'base href' build/web/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
