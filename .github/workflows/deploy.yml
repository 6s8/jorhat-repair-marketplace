name: Deploy Fixly Web & Release APKs

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter build web --release --base-href "/jorhat-repair-marketplace/"
          cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          name: "Fixly App v1.0.0 - Android & Web"
          tag_name: "v1.0.0"
          files: |
            apks/fixly.apk
            apks/fixly_customer.apk
            apks/fixly_technician.apk
            apks/fixly_retailer.apk
          body: |
            ### 📱 Fixly - Assam Repair & Parts Hub App Release v1.0.0

            #### 📦 Download Android APKs:
            - **[Unified Fixly App (All Roles)](https://github.com/6s8/jorhat-repair-marketplace/releases/download/v1.0.0/fixly.apk)**
            - **[Fixly Customer App](https://github.com/6s8/jorhat-repair-marketplace/releases/download/v1.0.0/fixly_customer.apk)**
            - **[Fixly Technician App](https://github.com/6s8/jorhat-repair-marketplace/releases/download/v1.0.0/fixly_technician.apk)**
            - **[Fixly Retailer App](https://github.com/6s8/jorhat-repair-marketplace/releases/download/v1.0.0/fixly_retailer.apk)**

            #### 🌐 Web Application:
            - **Live Web App**: [https://6s8.github.io/jorhat-repair-marketplace/](https://6s8.github.io/jorhat-repair-marketplace/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
