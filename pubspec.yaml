name: jorhat_repair_marketplace
description: "Production-grade multi-vendor on-demand repair service and spare parts marketplace app for Jorhat, Assam."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2
  go_router: ^14.2.0
  equatable: ^2.0.5
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  google_maps_flutter: ^2.10.0
  http: ^1.2.2
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
