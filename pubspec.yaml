name: jorhat_repair_marketplace
description: "Production-grade multi-vendor on-demand repair service and spare parts marketplace app for Jorhat, Assam."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2
  go_router: ^14.2.0
  equatable: ^2.0.5
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  google_maps_flutter: ^2.10.0
  http: ^1.2.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  pdf: ^3.13.0
  printing: ^5.15.0
  uuid: ^4.6.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/appliances/
    - assets/brands/
    - assets/google_logo.png
    - assets/app_icon.png
